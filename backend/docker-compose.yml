services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vidrierapp}
      POSTGRES_USER: ${POSTGRES_USER:-vidrierapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidrierapp_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vidrierapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:10.20
    profiles: ["tools"]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vidrierapp}
      FLYWAY_USER: ${POSTGRES_USER:-vidrierapp}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-vidrierapp_dev_only}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  vidrierapp-pgdata:
